  <text x="430.0" y="93.0" text-anchor="middle" class="body">•  I&apos;m currently learning full-stack and embedded systems development.</text><text x="430.0" y="121.0" text-anchor="middle" class="body">•  How to reach me: e: owenwang260@gmail.com</text><text x="430.0" y="149.0" text-anchor="middle" class="body">•  Pronouns: he/him</text><text x="430.0" y="177.0" text-anchor="middle" class="body">•  Fun fact: I like hockey and snowboarding. Occasional for-fun magician.</text>
